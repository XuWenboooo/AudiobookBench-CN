    - source_real_duration
    - generator_output_sample_rate
    - generator_output_num_channels
    - pretrim_num_samples
    - pretrim_duration
    - posttrim_num_samples
    - posttrim_duration
    - final_synthetic_num_samples
    - synthetic_duration
    - duration_ratio
    - duration_delta_samples
    - rms_gain_requested
    - rms_gain_clamped
    - rms_gain_peak_safe
    - rms_gain
    - crossfade_samples
    - clean_timeline_start_sample
    - clean_timeline_end_sample
    - manipulated_timeline_start_sample
    - manipulated_timeline_end_sample
    - attack_start_sample
    - attack_end_sample
    - attack_core_start_sample
    - attack_core_end_sample
    - blend_start_sample
    - blend_end_sample
    - blend_in_start_sample
    - blend_in_end_sample
    - blend_out_start_sample
    - blend_out_end_sample
    - attack_start
    - attack_end
    - generation_seed
    - generation_attempt_count
    - generation_status
    - generation_failure_reason
    - qa_flags
    - asr_backend
    - asr_transcript
    - asr_cer
    - reference_synthetic_ecapa_cosine
    - target_synthetic_ecapa_cosine
    - split
  failure_rows_retained: true

generation_qa:
  executed_before_detector: true
  detector_output_access: forbidden
  hard_checks:
    - unique_valid_lineage
    - exact_text_and_hash_equality
    - immutable_generator_provenance
    - decodable_nonempty_finite_audio
    - deterministic_supported_channel_rate_conversion
    - active_speech_exists
    - duration_ratio_within_hard_bounds
    - mono_16k_finite_post_dsp
    - peak_below_0_999_and_no_clipping
    - serialization_roundtrip_length
    - prefix_suffix_core_crossfade_and_gt_integrity
  asr:
    role: diagnostic_only
    backend: TO_BE_FROZEN_OR_EXPLICITLY_OMITTED_BEFORE_GENERATION
    selection_filter: false
    defines_gt: false
  speaker_similarity:
    role: attack_qa_diagnostic_only
    selection_filter: false
    detector_input: false

failure_policy:
  retain_every_planned_manifest_row: true
  substitute_case: false
  formal_waveform_for_failed_case: false
  report_denominators_by_split_and_speaker: true
  hard_failure_reasons:
    - generator_crash
    - unreadable_audio
    - empty_audio
    - nonfinite_audio
    - no_speech_detected
    - lineage_failure
    - no_eligible_reference
    - exact_input_text_failure
    - unsupported_audio_conversion
    - duration_ratio_out_of_bounds
    - post_dsp_clipping_or_nonfinite
    - serialization_mismatch
    - waveform_or_gt_verification_failure
    - crossfade_interval_too_short
  retained_success_qa_flags:
    - high_asr_cer
    - low_speaker_similarity
    - audible_artifact
    - unusual_prosody
    - low_detector_score

detector:
  input: suspect_waveform_only
  forbidden_inputs:
    - reference_audio_or_embedding
    - target_or_reference_speaker_id
    - clean_original
    - transcript_or_text_id
    - generator_identity_or_metadata
    - asr_or_generation_qa
    - attack_interval
  training: forbidden
  threshold_tuning_on_a2: forbidden
  reuse:
    - Day5_temporal_features
    - B0
    - B1a
    - B1b
    - B2
  diagnostics:
    - B4_boundary_transient
  forbidden_baselines:
    - B3_same_grid_clean_pair_oracle
  frozen_configs:
    - configs/day6a_localization_baseline.yaml
    - configs/day6b_speaker_consistency.yaml
    - configs/day6c_confound_controls.yaml
  frozen_threshold_sources:
    - results/day6a/metrics_by_split.csv
    - results/day6b/metrics_by_split.csv
  speech_active_conditional:
    enabled: true
    threshold: 0.5
    label_agnostic: true
    report_alongside_original_population: required

evaluation:
  splits: [train, val, test]
  primary_gt: full
  full_gt: includes_both_400_sample_crossfade_zones
  core_gt: excludes_both_400_sample_crossfade_zones
  window_metrics: [auroc, auprc, f1]
  case_metrics: [auroc, auprc, f1]
  other_outputs:
    - b1_core_boundary_outside_anomaly
    - outside_anomaly
    - global_peak_localization_error_seconds
    - speech_active_positive_and_negative_retention
    - planned_success_failed_denominators
    - clean_false_positive_diagnostics
    - descriptive_duration_aware_a2_vs_a0_a1
  threshold_free_metrics_required: true
  thresholds: reuse_week1_only
  bootstrap:
    unit: paired_case_id
    resamples: 2000
    seed: 20260905
  no_cherry_picking: true
  pass_requires_auroc_target: false

known_unseen_plan:
  week2a: one_generator_pipeline_and_interpretability_pilot
  week2b: separately_registered_multi_generator_known_setting
  week2c: develop_on_generator_families_A_B_evaluate_family_C_unseen
  implement_week2b_or_week2c_now: false

claim_boundary:
  maximum_supported_if_positive: >-
    Same-text target-speaker-conditioned synthetic replacement under the
    tested immutable generator checkpoint and constructed protocol exhibits
    localization signal for the named frozen baseline.
  unsupported:
    - general_deepfake_detection
    - universal_tts_detection
    - unseen_generator_robustness
    - generic_voice_cloning_robustness
    - adaptive_robustness
    - native_audiobook_robustness
    - perceptual_realism
    - deployment_readiness
    - strict_generator_training_data_independence

readiness:
  protocol_choices_frozen: true
  semantic_correction_applied: true
  implementation_readiness: HOLD
  generator_license_chain_checked: false
  exact_checkpoint_hash_recorded: false
  hardware_runtime_known: false
  windows_smoke_test_passed: false
  reference_protocol_frozen: true
  text_normalization_frozen: true
  sample_selection_frozen: true
  failure_policy_frozen: true
  duration_policy_frozen: true
  silence_policy_frozen: true
  dsp_frozen: true
  manifest_schema_implemented_and_validated: false
  gt_implementation_validated: false
  detector_leakage_audit_passed: false
  week1_artifacts_untouched: true
  week1_hash_verification_before_implementation: required
