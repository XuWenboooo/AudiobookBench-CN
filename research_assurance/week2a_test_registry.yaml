# Week2A A2 Test Registry (normalized from A2_REQUIRED_TEST_MAP.md)
# result_status initialized to NOT_RUN for all tests (no test is claimed implemented
# unless a real test file/result can be cited). Phases normalized:
# PHASE_A_PRE_A2_UNIT / PHASE_B_FIXTURE_MANIFEST / PHASE_C_POST_A2_DATA.

tests:
  - test_id: T01
    name: test_a2_dual_timeline_gt
    sources: [A2_REQUIRED_TEST_MAP.md, WEEK2_DAY11_EVAL_DRY_AUDIT.md]
    covers_findings: [F3, F9]
    covers_leakage: [L4]
    phases: [PHASE_A_PRE_A2_UNIT, PHASE_B_FIXTURE_MANIFEST]
    unit_or_integration: BOTH
    requires_a2_wav: false
    requires_sidecar: true
    requires_week1_artifact: false
    expected_assertion: prefix bit-equal; suffix == clean + duration_delta; core == scaled synthetic; both blends match the frozen formula; exact final length; valid half-open bounds
    expected_failure_mode: suffix/core/blend mismatch or bounds out of range
    blocks_metric: true
    blocks_claim: true
    implementation_day: Day11
    result_status: IMPLEMENTED_PASS
    result_evidence: results/day11/test_execution.json

